name: VolumeCalcReview
options:
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: YES
    MARKETING_VERSION: '1.0'
    CURRENT_PROJECT_VERSION: '5'
targets:
  VolumeCalc:
    type: application
    platform: iOS
    sources: [AnlagenVolumen]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.kamilunavo.volumecalc
        INFOPLIST_KEY_CFBundleDisplayName: VolumeCalc
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        TARGETED_DEVICE_FAMILY: '1,2'
  VolumeCalcUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [ReviewUITests]
    dependencies:
      - target: VolumeCalc
    settings:
      base:
        TEST_TARGET_NAME: VolumeCalc
        PRODUCT_BUNDLE_IDENTIFIER: de.kamilunavo.volumecalc.uitests
schemes:
  VolumeCalc:
    build:
      targets:
        VolumeCalc: all
    test:
      targets: [VolumeCalcUITests]
