name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.2"
      - run: swift test

  ios-build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - run: bash ci/alternative-store-smoke.sh
      - run: xcodebuild -project AnlagenVolumen.xcodeproj -scheme VolumeCalc -sdk iphonesimulator -configuration Debug CODE_SIGNING_ALLOWED=NO build
      - run: xcodebuild -project AnlagenVolumen.xcodeproj -scheme VolumeCalc -sdk iphoneos -configuration Release CODE_SIGNING_ALLOWED=NO build

  android-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"
      - name: Verify VolumeCalc launcher, splash and Play icon parity
        shell: bash
        run: |
          set -euo pipefail
          node scripts/generate_android_icons.cjs --verify
          grep -Fq 'android:windowSplashScreenAnimatedIcon">@drawable/ic_launcher' android/app/src/main/res/values-v31/styles.xml
          grep -Fq 'android:icon="@drawable/ic_launcher"' android/app/src/main/AndroidManifest.xml
          ! grep -Fq 'android:roundIcon=' android/app/src/main/AndroidManifest.xml
          test -z "$(find android/app/src/main/res -type f \( -path '*/mipmap-anydpi*' -o -iname '*adaptive*' -o -iname '*foreground*' -o -iname '*background*' \) -print -quit)"
          grep -Fq 'versionCode = 5' android/app/build.gradle.kts
          grep -Fq 'versionName = "1.1.0"' android/app/build.gradle.kts
      - run: gradle -p android testDebugUnitTest
      - run: gradle -p android bundleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: VolumeCalc-1.1.0-5-unsigned-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14

  review-device-tests:
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        family: [iPhone, iPad]
    steps:
      - uses: actions/checkout@v5
      - run: brew install xcodegen
      - run: xcodegen generate --spec review-project.yml
      - run: python3 scripts/review-device-tests.py VolumeCalc "${{ matrix.family }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: review-VolumeCalc-${{ matrix.family }}
          path: review-results
          if-no-files-found: error
          retention-days: 14
