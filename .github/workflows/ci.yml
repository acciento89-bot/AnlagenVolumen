name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  core-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.2"
      - run: swift test

  ios-build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - run: xcodebuild -project AnlagenVolumen.xcodeproj -scheme VolumeCalc -sdk iphonesimulator -configuration Debug CODE_SIGNING_ALLOWED=NO build

  android-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"
      - run: gradle -p android testDebugUnitTest

  review-device-tests:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - run: brew install xcodegen
      - run: xcodegen generate --spec review-project.yml
      - run: python3 scripts/review-device-tests.py VolumeCalc
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: review-VolumeCalc
          path: review-results
          if-no-files-found: error
          retention-days: 14
