name: VolumeCalc Android parity screenshots

on:
  push:
    branches: [main, fix/android-ios-parity-20260913]
    paths:
      - 'android/**'
      - '.github/workflows/android-parity-screenshots.yml'
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/android-parity-screenshots.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Build debug APK
        run: gradle -p android --no-daemon assembleDebug --stacktrace
      - name: Capture exact tested UI
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_7
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          script: bash "$GITHUB_WORKSPACE/.github/scripts/capture-android-parity-screenshots.sh"
      - uses: actions/upload-artifact@v4
        with:
          name: volumecalc-real-android-screenshots
          path: android/parity-screenshots/*.png
          if-no-files-found: error
          retention-days: 30
