name: VolumeCalc Android parity screenshots

on:
  push:
    branches: [main, fix/android-ios-parity-20260913]
    paths:
      - 'android/**'
      - '!android/store/google-play/screenshots/**'
      - '.github/scripts/**'
      - '.github/workflows/android-parity-screenshots.yml'
  pull_request:
    paths:
      - 'android/**'
      - '.github/scripts/**'
      - '.github/workflows/android-parity-screenshots.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Validate capture contract
        run: bash .github/scripts/test-capture-android-parity-screenshots.sh
      - name: Build debug APK
        run: gradle -p android --no-daemon assembleDebug --stacktrace

      - name: Enable emulator acceleration
        run: |
          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm
          fi
      - name: Capture exact tested UI
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_7
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          script: bash "$GITHUB_WORKSPACE/.github/scripts/capture-android-parity-screenshots.sh"
      - uses: actions/upload-artifact@v4
        with:
          name: volumecalc-real-android-screenshots
          path: android/parity-screenshots/*.png
          if-no-files-found: error
          retention-days: 30

      - name: Persist authentic screenshots
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          target='android/store/google-play/screenshots/de-DE'
          mkdir -p "$target"
          rm -f "$target"/*.png
          cp android/parity-screenshots/*.png "$target"/
          git config user.name 'Kamilunavo Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add "$target"
          if ! git diff --cached --quiet; then
            git commit -m 'Persist authentic VolumeCalc Android screenshots'
            git push origin HEAD:main
          fi
