name: Import VolumeCalc project

on:
  push:
    branches: [main]
    paths:
      - '.bootstrap/**'
      - '.github/workflows/bootstrap-project.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-project:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Expand staged project
        shell: bash
        run: |
          set -euo pipefail
          SRC='.bootstrap/volumecalc-project.tar.gz.b64'
          if [[ ! -f "$SRC" ]]; then
            echo 'Bootstrap payload already consumed.'
            exit 0
          fi
          base64 --decode "$SRC" > "$RUNNER_TEMP/volumecalc-project.tar.gz"
          tar -xzf "$RUNNER_TEMP/volumecalc-project.tar.gz" -C .
          rm -f "$SRC"
          rmdir .bootstrap 2>/dev/null || true
          git config user.name 'Kamilunavo Build Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'feat: import VolumeCalc 1.0 foundation'
          git push origin HEAD:main
