name: Android Play Release

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android-play-release.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
      ANDROID_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
      ANDROID_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"
      - name: Validate signing secrets
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          test -n '${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}'
          test -n "$ANDROID_UPLOAD_STORE_PASSWORD"
          test -n "$ANDROID_UPLOAD_KEY_ALIAS"
          test -n "$ANDROID_UPLOAD_KEY_PASSWORD"
      - name: Restore Play upload keystore
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}' | base64 --decode > "$RUNNER_TEMP/volumecalc-upload.jks"
          chmod 600 "$RUNNER_TEMP/volumecalc-upload.jks"
          echo "ANDROID_UPLOAD_KEYSTORE_PATH=$RUNNER_TEMP/volumecalc-upload.jks" >> "$GITHUB_ENV"
      - name: Test release
        run: gradle -p android testDebugUnitTest --stacktrace
      - name: Build release bundle
        run: gradle -p android bundleRelease --stacktrace
      - name: Verify signed Play bundle
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          AAB='android/app/build/outputs/bundle/release/app-release.aab'
          test -s "$AAB"
          jarsigner -verify -verbose -certs "$AAB" | tee /tmp/jarsigner.txt
          grep -Fq 'jar verified.' /tmp/jarsigner.txt
          sha256sum "$AAB" | tee android/app/build/outputs/bundle/release/VolumeCalc-1.0.1-3-PlayStore.aab.sha256
          cp "$AAB" android/app/build/outputs/bundle/release/VolumeCalc-1.0.1-3-PlayStore.aab
      - name: Upload signed release bundle
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: VolumeCalc-1.0.1-3-PlayStore
          path: |
            android/app/build/outputs/bundle/release/VolumeCalc-1.0.1-3-PlayStore.aab
            android/app/build/outputs/bundle/release/VolumeCalc-1.0.1-3-PlayStore.aab.sha256
          if-no-files-found: error
          retention-days: 14
